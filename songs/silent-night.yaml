lyrics:
  - Si-lent night_ ho-ly night_ all is calm, all is bright, round yon vir-gin moth-er and child_ ho-ly in-fant so ten-der and mild, sleep in hea-ven-ly peace_ sleep in hea-ven-ly peace_
