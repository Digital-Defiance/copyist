lyrics:
  - I am the ve-ry mo-del of a mo-dern Ma-jor-Ge-ne-ral, I've in-for-ma-tion ve-ge-ta-ble, a-ni-mal, and mi-ne-ral, I know the kings of Eng-land, and I quote the fights his-to-ri-cal, From Ma-ra-thon to Wa-ter-loo, in or-der ca-te-go-ri-cal; I'm ve-ry well ac-quaint-ed, too, with mat-ters ma-the-ma-ti-cal, I un-der-stand e-qua-tions, both the sim-ple and quad-ra-ti-cal, A-bout bi-no-mial the-o-rem I'm teem-ing with a lot o' news, With ma-ny cheer-ful facts a-bout the square of the hy-pot-e-nuse.
