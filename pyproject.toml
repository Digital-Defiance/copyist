[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "copyist"
version = "0.0.1"
description = "The song, the score, the sound: score-first songwriting, arranging, engraving and rendering."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "music21>=9.1",
    "verovio>=4.3",
    "PyYAML>=6.0",
    "pronouncing>=0.2",
    "pymupdf>=1.24",
    "mido>=1.3",
]
# Audio rendering also needs TinySoundFont. Install it without its optional
# playback dependency (PyAudio needs the PortAudio system library):
#     pip install --no-deps tinysoundfont

[project.optional-dependencies]
# Singing (copyist sing): pitch checking and mixing. SoulX-Singer itself runs
# in its own environment; see docs/singing.md.
sing = ["librosa>=0.10", "soundfile>=0.12", "faster-whisper>=1.0"]

[project.scripts]
copyist = "copyist.cli:main"

[tool.setuptools]
packages = ["copyist", "copyist.web"]

[tool.setuptools.package-data]
"copyist.web" = ["static/*", "static/fonts/*"]
"copyist" = ["demo/*.yaml"]
