[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "copyist"
version = "0.0.1"
description = "The song, the score, the sound: score-first songwriting, arranging, engraving and rendering."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Digital Defiance and Copyist contributors" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: Artistic Software",
]

dependencies = [
    "music21>=9.1",
    "verovio>=4.3",
    "PyYAML>=6.0",
    "pronouncing>=0.2",
    "pymupdf>=1.24",
    "mido>=1.3",
]
# Audio rendering also needs TinySoundFont. Install it without its optional
# playback dependency (PyAudio needs the PortAudio system library):
#     pip install --no-deps tinysoundfont

[project.urls]
Homepage = "https://github.com/Digital-Defiance/copyist"

[project.optional-dependencies]
# Singing (copyist sing): pitch checking and mixing. SoulX-Singer itself runs
# in its own environment; see docs/singing.md.
sing = ["librosa>=0.10", "soundfile>=0.12", "faster-whisper>=1.0"]
# Transcribing recordings (copyist transcribe): the same audio tools; Demucs comes from
# scripts/setup-demucs.sh. See docs/transcribing.md.
transcribe = ["librosa>=0.10", "soundfile>=0.12", "faster-whisper>=1.0"]

[project.scripts]
copyist = "copyist.cli:main"

[tool.setuptools]
packages = ["copyist", "copyist.web", "copyist.styles"]

[tool.setuptools.package-data]
"copyist.web" = ["static/*", "static/fonts/*"]
"copyist.styles" = ["*.yaml"]
"copyist" = ["demo/*.yaml", "sound/*"]
