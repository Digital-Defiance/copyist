# Unsigned Mac builds, as workflow artifacts (docs/desktop-app.md, scripts/package/README.md).
# Runs on v* tags and by hand. It never touches the GitHub Release: the release DMG is
# built, signed, notarized and stapled on the owner's Mac (scripts/package/bundle-mac.sh
# --sign) and uploaded with `gh release create`, so an unsigned CI build can't replace it
# (DECISIONS.md, 2026-10-19). The Intel build is a smoke test until Intel ships. GitHub
# retired the macos-13 image in December 2025; macos-15-intel is its Intel runner now, until
# the macOS 15 image retires (planned for fall 2027), after which Intel builds end here.
name: Mac build (unsigned)
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mac:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            triple: aarch64-apple-darwin
            arch: aarch64
          - os: macos-15-intel
            triple: x86_64-apple-darwin
            arch: x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python engine
        run: |
          python -m venv .venv
          .venv/bin/pip install -U pip
          .venv/bin/pip install -e .
          .venv/bin/pip install --no-deps tinysoundfont
          scripts/package/freeze-engine.sh ${{ matrix.triple }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Tauri build
        run: |
          (cd app && npm ci)
          scripts/package/bundle-mac.sh
          test -z "$(git status --short)"
      - name: Stage DMG
        run: |
          mkdir -p dist/unsigned
          dmg=$(find app/src-tauri/target/release/bundle/dmg -name '*.dmg' | head -1)
          test -n "$dmg"
          name="Copyist_${GITHUB_REF_NAME#v}_${{ matrix.arch }}-unsigned.dmg"
          cp "$dmg" "dist/unsigned/$name"
          shasum -a 256 "dist/unsigned/$name" | tee "dist/unsigned/$name.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: copyist-mac-${{ matrix.arch }}-unsigned
          path: dist/unsigned/*
