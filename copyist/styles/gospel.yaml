format: copyist-style/0
name: Gospel
family: Soul and gospel
about: Slow gospel with a 12/8 lean. The organ holds the chords; bass and drums keep a steady backbeat. No choppy comps.
tempo: [56, 84]
instruments: {piano: organ, bass: electric-bass}
production: soulful gospel, Hammond organ, piano, choir, handclaps, slow 12/8 feel, church, powerful
meters:
  "4/4":
    # Held pads, not re-struck triplets — pipe organ (and a real Hammond) needs sustain.
    rh:
      - [[0, 4, chord]]
      - [[0, 2, chord], [2, 2, chord]]
    lh:
      - [[0, 4, root]]
      - [[0, 2, root], [2, 2, fifth]]
    bass:
      - [[0, 2, root], [2, 2, root]]
      - [[0, 4, root]]
    drums:
      hands: [[0, 1, [hihat]], [1, 1, [hihat, snare]], [2, 1, [hihat]], [3, 1, [hihat, snare]]]
      feet: [[0, 2, [kick]], [2, 2, [kick]]]
      fill: [[3, 0.5, [snare]], [3.5, 0.5, [tom]]]
