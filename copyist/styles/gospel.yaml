format: copyist-style/0
name: Gospel
family: Soul and gospel
about: A slow gospel groove in triplets (the 12/8 feel). The organ answers across two bars; kick and snare lean on the backbeat.
tempo: [56, 84]
instruments: {piano: organ, bass: electric-bass}
production: soulful gospel, Hammond organ, piano, choir, handclaps, slow 12/8 feel, church, powerful
meters:
  "4/4":
    rh:
      - [["1/3", "1/3", chord], ["2/3", "1/3", chord], ["4/3", "1/3", chord], ["5/3", "1/3", chord],
         ["7/3", "1/3", chord], ["8/3", "1/3", chord], ["10/3", "1/3", chord], ["11/3", "1/3", chord]]
      - [["1/3", "2/3", chord], ["4/3", "2/3", chord], ["7/3", "2/3", chord], ["10/3", "2/3", chord]]
    lh:
      - [[0, 2, root], [2, 2, fifth]]
      - [[0, 4, root]]
    bass:
      - [[0, 2, root], [2, 1, fifth], [3, 1, approach]]
      - [[0, 2, root], [2, 2, fifth]]
    drums:
      hands: [[0, 1, [hihat]], [1, 1, [hihat, snare]], [2, 1, [hihat]], [3, 1, [hihat, snare]]]
      feet: [[0, 1, [kick]], ["5/3", "1/3", [kick]], [2, 1, [kick]]]
      fill: [[3, "1/3", [snare]], ["10/3", "1/3", [snare]], ["11/3", "1/3", [tom]]]
