format: copyist-style/0
name: Gospel
family: Soul and gospel
about: Slow gospel at the piano. The tune on the keys; soft answering chords and a patient bass. No drums — the kit and clarinet made it sound like a kids' band.
tempo: [56, 84]
instruments: {melody: piano, bass: upright-bass}
keep_rh: true
production: soulful gospel, Hammond organ, piano, choir, handclaps, slow 12/8 feel, church, powerful
meters:
  "4/4":
    # Sparse answers under the tune (open melody pitches). Hold, don't chatter.
    rh:
      - [[1, 1, shell], [3, 1, shell]]
      - [[0, 2, chord], [2, 2, chord]]
    lh:
      - [[0, 4, root]]
      - [[0, 2, root], [2, 2, fifth]]
    bass:
      - [[0, 4, root]]
      - [[0, 2, root], [2, 2, fifth]]
    drums: none
