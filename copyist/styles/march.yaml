format: copyist-style/0
name: March
family: Hymns and classical
about: A parade. Oom-pah that answers with a held bar; snare march rhythm, bass drum on one and three.
tempo: [104, 128]
instruments: {melody: flute, bass: upright-bass}
production: brass band march, sousaphone, snare drum, cymbals, trumpets, festive, parade
