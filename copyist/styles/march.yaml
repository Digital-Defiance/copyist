      feet: [[0, 1, [kick]], [2, 1, [kick]]]
      fill: [[2, 0.25, [snare]], [2.25, 0.25, [snare]], [2.5, 0.25, [snare]], [2.75, 0.25, [snare]],
             [3, 0.25, [snare]], [3.25, 0.25, [snare]], [3.5, 0.25, [snare]], [3.75, 0.25, [snare]]]
