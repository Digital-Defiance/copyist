format: copyist-style/0
name: 6/8 ballad
family: Pop and rock
about: A slow sway in two. Root and fifth on the big beats; piano chords that open every other bar. Snare on the second big beat.
tempo: [48, 72]
instruments: {bass: electric-bass}
production: 6/8 rock ballad, slow sway, piano, electric bass, drums, warm, emotional
meters:
  "6/8":
    rh:
      - [[0.5, 0.5, chord], [1, 0.5, chord], [2, 0.5, chord], [2.5, 0.5, chord]]
      - [[0.5, 1, chord], [2, 1, chord]]
    lh:
      - [[0, 1.5, root], [1.5, 1.5, root]]
      - [[0, 1.5, root], [1.5, 1.5, fifth]]
    bass:
      - [[0, 1.5, root], [1.5, 1.5, fifth]]
      - [[0, 3, root]]
    drums:
      hands: [[0, 0.5, [hihat]], [0.5, 0.5, [hihat]], [1, 0.5, [hihat]], [1.5, 0.5, [hihat, snare]], [2, 0.5, [hihat]], [2.5, 0.5, [hihat]]]
      feet: [[0, 1.5, [kick]]]
      fill: [[1.5, 0.5, [snare]], [2, 0.5, [tom]], [2.5, 0.5, [floor-tom]]]
