format: copyist-style/0
name: Waltz
family: Hymns and classical
about: A gentle 3/4. The piano carries the tune over a breathing left hand and bass. No drums.
tempo: [72, 180]
instruments: {melody: piano, bass: upright-bass}
production: gentle 3/4 waltz, acoustic piano, soft strings, warm bass, intimate and heartfelt
meters:
  "3/4":
    # Right hand is cleared when melody is on the piano (see arrange.py); left hand
    # and bass carry a four-bar phrase under the tune.
    rh: []
    lh:
      - [[0, 3, root]]
      - [[0, 2, root], [2, 1, fifth]]
      - [[0, 3, root]]
      - [[0, 3, fifth]]
    bass:
      - [[0, 3, root]]
      - [[0, 2, root], [2, 1, fifth]]
      - [[0, 3, root]]
      - [[0, 2, fifth], [2, 1, root]]
    drums: none
