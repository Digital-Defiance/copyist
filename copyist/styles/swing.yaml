format: copyist-style/0
name: Swing
family: Jazz and blues
about: Swung eighths. A walking bass and the ride cymbal's spang-a-lang under a sax lead (no piano shells fighting the tune).
feel: swing
tempo: [110, 200]
instruments: {melody: sax, bass: upright-bass}
production: swing jazz, 1940s, walking upright bass, ride cymbal, alto sax, horn section, swinging
meters:
  "4/4":
    # Two empty bars that cycle: no Charleston under the sax (it sat on the tune).
    rh:
      - []
      - []
    lh: []
    bass: walk
    drums:
      hands: [[0, 1, [ride]], [1, 0.5, [ride]], [1.5, 0.5, [ride]], [2, 1, [ride]], [3, 0.5, [ride]], [3.5, 0.5, [ride]]]
      feet: [[1, 1, [hihat-pedal]], [3, 1, [hihat-pedal]]]
      fill: [[2, 0.5, [snare]], [2.5, 0.5, [snare]], [3, 0.5, [tom]], [3.5, 0.5, [snare]]]
