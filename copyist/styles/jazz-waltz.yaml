format: copyist-style/0
name: Jazz waltz
family: Jazz and blues
about: Swing in three. Walking bass and ride under a sax lead (no piano shells fighting the tune).
feel: swing
tempo: [120, 200]
instruments: {melody: sax, bass: upright-bass}
production: jazz waltz, 3/4 swing, walking upright bass, ride cymbal, alto sax, elegant
meters:
  "3/4":
    # Two empty bars that cycle: no shells under the sax (same reason as swing).
    rh:
      - []
      - []
    lh: []
    bass: walk
    drums:
      hands: [[0, 1, [ride]], [1, 0.5, [ride]], [1.5, 0.5, [ride]], [2, 1, [ride]]]
      feet: [[1, 1, [hihat-pedal]]]
      fill: [[2, 0.5, [snare]], [2.5, 0.5, [snare]]]
